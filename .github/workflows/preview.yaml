name: Preview

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  deployments: write
  pull-requests: write

env:
  NODE_VERSION: 24.11.0
  PNPM_VERSION: 10.22.0

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Checkout source code
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/node-install
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}

      - name: Build
        run: pnpm build

      - name: Deploy Backend Preview
        id: deploy-backend
        working-directory: apps/backend
        run: |
          echo "🚀 Deploying backend..."
          OUTPUT=$(pnpm wrangler versions upload 2>&1) || {
            EXIT_CODE=$?
            echo "❌ Backend deployment failed with exit code $EXIT_CODE"
            echo "Output:"
            echo "$OUTPUT"
            exit $EXIT_CODE
          }
          echo "$OUTPUT"

          BACKEND_PREVIEW_URL=$(echo "$OUTPUT" | grep "Version Preview URL:" | sed 's/.*Version Preview URL: //' | tr -d '[:space:]')

          if [ -z "$BACKEND_PREVIEW_URL" ]; then
            echo "❌ Backend Version Preview URL not found in wrangler output"
            echo "Full output was:"
            echo "$OUTPUT"
            exit 1
          fi

          echo "✅ Backend deployed successfully"
          echo "BACKEND_PREVIEW_URL=$BACKEND_PREVIEW_URL" >> $GITHUB_ENV
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Frontend Preview
        id: deploy-frontend
        working-directory: apps/frontend
        run: |
          echo "🚀 Deploying frontend..."
          OUTPUT=$(pnpm wrangler versions upload 2>&1) || {
            EXIT_CODE=$?
            echo "❌ Frontend deployment failed with exit code $EXIT_CODE"
            echo "Output:"
            echo "$OUTPUT"
            exit $EXIT_CODE
          }
          echo "$OUTPUT"

          FRONTEND_PREVIEW_URL=$(echo "$OUTPUT" | grep "Version Preview URL:" | sed 's/.*Version Preview URL: //' | tr -d '[:space:]')

          if [ -z "$FRONTEND_PREVIEW_URL" ]; then
            echo "❌ Frontend Version Preview URL not found in wrangler output"
            echo "Full output was:"
            echo "$OUTPUT"
            exit 1
          fi

          echo "✅ Frontend deployed successfully"
          echo "FRONTEND_PREVIEW_URL=$FRONTEND_PREVIEW_URL" >> $GITHUB_ENV
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Show Preview URLs
        run: |
          echo "Backend Preview URL: ${{ env.BACKEND_PREVIEW_URL }}"
          echo "Frontend Preview URL: ${{ env.FRONTEND_PREVIEW_URL }}"

      - name: Delete previous bot comments
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            // GitHub Actionsボットの既存プレビューコメントを削除
            for (const comment of comments) {
              const isGithubActionsBot = comment.user?.login === 'github-actions[bot]';
              const isPreviewComment = comment.body?.includes('🚀 プレビューデプロイが完了しました！');
              if (isGithubActionsBot && isPreviewComment) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comment.id
                });
              }
            }

      - name: Comment PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const backendUrl = '${{ env.BACKEND_PREVIEW_URL }}';
            const frontendUrl = '${{ env.FRONTEND_PREVIEW_URL }}';
            const comment = `🚀 プレビューデプロイが完了しました！
            **Backend API:** ${backendUrl}
            **Frontend:** ${frontendUrl}
            ---
            *Commit: ${{ github.event.pull_request.head.sha }}*`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
